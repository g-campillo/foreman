<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      worker-src is stated rather than left to fall back to default-src, because
      Monaco's workers are the only ones we ship and the fallback is easy to break
      by accident. Measured in the PACKAGED build (electron-vite preview, file://,
      the loadFile path — dev always passes because its origin is http://localhost):

        file:// worker, same directory as the bundle .... LOADS
        file:// worker, path that does not exist ........ error event (so the above is real)
        blob:  worker .................................. BLOCKED by this policy

      So Vite's default `?worker` output — a separate asset addressed with
      `new URL(..., import.meta.url)` — is fine, and `?worker&inline` is NOT: it
      builds a blob: URL and would need `blob:` added here. Do not add it; taking
      the inline path is the thing that would force that, and there is no reason to.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Foreman</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
